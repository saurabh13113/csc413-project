name: Compile main.tex into Report.pdf

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo into runner
        uses: actions/checkout@v4

      - name: Compile latex doc
        uses: xu-cheng/latex-action@v3
        with:
          root_file: proposal/main.tex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf